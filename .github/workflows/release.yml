name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-crates:
    needs: create-release
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
      - name: Publish agentctl-core
        if: ${{ env.CARGO_REGISTRY_TOKEN != '' }}
        run: cargo publish -p agentctl-core --locked
      - name: Publish agentctl
        if: ${{ env.CARGO_REGISTRY_TOKEN != '' }}
        run: cargo publish -p agentctl --locked