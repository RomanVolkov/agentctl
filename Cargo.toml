[workspace]
members = ["agentctl-core", "agentctl"]
resolver = "2"

[workspace.package]
version = "1.0.1"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
colored = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shellexpand = "3"
similar = "2"
thiserror = "1"
toml = "0.8"
insta = "1"
